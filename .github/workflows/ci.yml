name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.config.name }} ${{ matrix.preset }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        config:
          - { name: Windows MSVC, os: windows-latest, cc: cl, cxx: cl }
          - { name: Linux GCC, os: ubuntu-latest, cc: gcc, cxx: g++ }
          - { name: Linux Clang, os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { name: macOS Clang, os: macos-latest, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-targets: false
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  bundle:
    name: Bundle ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-targets: false
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Build and install
        run: |
          cmake --preset release -DLASRS_BUILD_TESTS=OFF -DLASRS_BUILD_EXAMPLES=OFF
          cmake --build --preset release
          cmake --install build/release --prefix dist/lasrs-cpp
      - name: Third-party notices
        working-directory: rust
        run: cargo about generate about.hbs -o ../dist/lasrs-cpp/share/lasrs/THIRD-PARTY-NOTICES.txt
      - name: Build a program against the bundle
        run: |
          cmake -S tests/package -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/dist/lasrs-cpp"
          cmake --build build/package
          ctest --test-dir build/package --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: lasrs-cpp-${{ matrix.name }}
          path: dist/lasrs-cpp
          retention-days: 30

  sanitizers:
    name: Linux sanitizers
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-targets: false
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: >
          cmake --preset debug -B build/sanitizers
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build/sanitizers
      - name: Test
        run: ctest --test-dir build/sanitizers --output-on-failure

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4,cargo-deny@0.20.2
      - name: Install clang-format
        run: pipx install clang-format==21.1.8
      - name: rustfmt
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: clang-format
        run: git ls-files '*.hpp' '*.cpp' | xargs clang-format --dry-run --Werror
      - name: C header is up to date
        run: |
          cbindgen --config rust/cbindgen.toml --crate lasrs_ffi --output include/lasrs/lasrs.h rust
          git diff --exit-code include/lasrs/lasrs.h
      - name: cargo deny
        working-directory: rust
        run: cargo deny check
