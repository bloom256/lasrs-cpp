name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded pull request runs are cancelled; every run on main finishes, so
# the README badge never shows a cancelled run as failing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.config.name }} ${{ matrix.preset }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        config:
          - { name: Windows MSVC, os: windows-latest, cc: cl, cxx: cl }
          - { name: Linux GCC, os: ubuntu-latest, cc: gcc, cxx: g++ }
          - { name: Linux Clang, os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { name: Linux ARM GCC, os: ubuntu-24.04-arm, cc: gcc, cxx: g++ }
          - { name: macOS Clang, os: macos-latest, cc: clang, cxx: clang++ }
          - { name: macOS Intel Clang, os: macos-15-intel, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-targets: false
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Use the MSVC linker for Rust
        if: runner.os == 'Windows'
        # Git Bash's /usr/bin/link.exe would otherwise shadow MSVC's link.exe.
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=${VCToolsInstallDir}bin\Hostx64\x64\link.exe" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  bundle:
    uses: ./.github/workflows/bundle.yml

  # Runs the prebuilt Linux bundles on other distros: the full test suite
  # where the default compiler supports C++20, the C API test everywhere.
  linux-distros:
    name: ${{ matrix.image }} ${{ matrix.arch }}
    needs: bundle
    # Run even if a non-Linux bundle failed.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        image:
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - fedora:latest
          - rockylinux/rockylinux:8
          - rockylinux/rockylinux:9
          - archlinux:latest
        exclude:
          - { arch: arm64, image: "archlinux:latest" }
    steps:
      - uses: actions/checkout@v7
      - name: Install compiler
        id: deps
        run: bash .github/scripts/install-distro-deps.sh
      - uses: actions/download-artifact@v8
        with:
          name: lasrs-cpp-linux-${{ matrix.arch }}
          path: bundle
      - uses: actions/download-artifact@v8
        with:
          name: test-data
          path: test_data
      - name: C API test
        run: |
          ${CC:-cc} -std=c99 -Wall -Wextra -I bundle/include tests/package/c_smoke.c bundle/lib/liblasrs_ffi.a \
            -lgcc_s -lutil -lrt -lpthread -lm -ldl -o c_smoke
          ./c_smoke c_smoke.laz
      - name: Test suite against the bundle
        if: steps.deps.outputs.suite == 'full'
        run: |
          cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/bundle" -DLASRS_TEST_DATA_DIR="$PWD/test_data"
          cmake --build build/tests --parallel
          ctest --test-dir build/tests --output-on-failure
      - name: Package test
        if: steps.deps.outputs.suite == 'full'
        run: |
          cmake -S tests/package -B build/package -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/bundle"
          cmake --build build/package
          ctest --test-dir build/package --output-on-failure

  sanitizers:
    name: Linux sanitizers
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-targets: false
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: >
          cmake --preset debug -B build/sanitizers
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build/sanitizers
      - name: Test
        run: ctest --test-dir build/sanitizers --output-on-failure

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4,cargo-deny@0.20.2
      - name: Install clang-format
        run: pipx install clang-format==21.1.8
      - name: rustfmt
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: clang-format
        run: git ls-files '*.hpp' '*.cpp' | xargs clang-format --dry-run --Werror
      - name: C header is up to date
        run: |
          cbindgen --config rust/cbindgen.toml --crate lasrs_ffi --output include/lasrs/lasrs.h rust
          git diff --exit-code include/lasrs/lasrs.h
      - name: cargo deny
        working-directory: rust
        run: cargo deny check
