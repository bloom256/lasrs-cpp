[workspace]
name = "lasrs-benchmarks"
description = "Benchmarks comparing lasrs-cpp with LASzip, laz-perf, PDAL and laspy"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
benchmark = "1.9.*"
cmake = ">=3.22"
laspy = "2.7.*"
laszip = "3.4.*"
laz-perf = "3.4.*"
lazrs-python = "0.8.*"
ninja = "*"
pdal = "2.10.*"
psutil = "*"
python = "3.12.*"
rust = "1.98.*"
matplotlib = ">=3.9"
py-cpuinfo = ">=9"

[target.linux-64.dependencies]
cxx-compiler = "*"

[target.osx-arm64.dependencies]
cxx-compiler = "*"

[tasks]
configure = "cmake -S . -B ../build/bench -G Ninja -DCMAKE_BUILD_TYPE=Release"
build = { cmd = "cmake --build ../build/bench", depends-on = ["configure"] }

[tasks.bench]
cmd = "python run_bench.py"
depends-on = ["build"]
