language = "C"
header = "/* SPDX-License-Identifier: MIT OR Apache-2.0 */\n/* Generated by cbindgen from rust/src. Do not edit. */"
include_guard = "LASRS_H"
cpp_compat = true
usize_is_size_t = true
style = "both"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true


[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
