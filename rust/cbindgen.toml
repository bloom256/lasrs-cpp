language = "C"
header = "/* SPDX-License-Identifier: MIT OR Apache-2.0 */\n/* Generated by cbindgen from rust/src. Do not edit. */\n\n/*\n * Unless a function says otherwise, pointers must be valid and non-null,\n * handles must come from this library and not be freed yet, and indices\n * must be in range. Functions that return LasrsStatus report errors through\n * lasrs_last_error(); functions that return a handle return null on error.\n */"
include_guard = "LASRS_H"
cpp_compat = true
usize_is_size_t = true
style = "both"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true


[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
