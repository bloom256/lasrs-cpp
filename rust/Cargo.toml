[package]
name = "lasrs_ffi"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "C ABI over the las crate, used by lasrs-cpp"
repository = "https://github.com/bloom256/lasrs-cpp"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
chrono = { version = "0.4", default-features = false }
las = { version = "0.11.1", features = ["laz-parallel"] }
uuid = "1"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
